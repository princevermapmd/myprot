<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard CMS · Prince Verma</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0b0b12; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen p-6 max-w-4xl mx-auto">

  <header class="flex items-center justify-between pb-6 mb-8 border-b border-[#252533]">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-[#ff6b4a] text-[#0b0b12] font-black flex items-center justify-center">CMS</div>
      <div>
        <h1 class="text-base font-extrabold">Admin Content Management System</h1>
        <p class="text-xs text-emerald-400"><i class="fas fa-circle-check"></i> Connected as admin</p>
      </div>
    </div>
    <button id="logoutBtn" class="bg-[#181824] border border-[#252533] text-xs font-bold px-4 py-2 rounded-xl text-rose-400 hover:bg-rose-500/10">
      Logout
    </button>
  </header>

  <main class="space-y-6">
    <div class="bg-[#12121c] border border-[#252533] rounded-2xl p-6">
      <h2 class="text-sm font-bold uppercase tracking-wider text-[#8b8b9e] mb-4">Publish New Book Cover or Poster Image</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-[#8b8b9e] mb-1">Creation Title / Description</label>
          <input type="text" id="title" placeholder="e.g. Haryana Cinema History Book Cover" class="w-full bg-[#181824] border border-[#252533] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-[#ff6b4a]">
        </div>
        <div>
          <label class="block text-xs text-[#8b8b9e] mb-1">Direct Image URL</label>
          <input type="url" id="url" placeholder="https://..." class="w-full bg-[#181824] border border-[#252533] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-[#ff6b4a]">
        </div>
        <button id="publishBtn" class="bg-[#ff6b4a] text-[#0b0b12] font-bold px-6 py-2.5 rounded-xl text-xs hover:opacity-90">
          Publish to Public Gallery
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA2hJxY5cj5Dzy_pTfdKvWp1musxqwB_bo",
      authDomain: "princeverma-pmd.firebaseapp.com",
      databaseURL: "https://princeverma-pmd-default-rtdb.firebaseio.com",
      projectId: "princeverma-pmd",
      storageBucket: "princeverma-pmd.firebasestorage.app",
      messagingSenderId: "646607150608",
      appId: "1:646607150608:web:19c48fbfe5774f1cd0f495"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Protection Route
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = 'login.html');
    });

    document.getElementById('publishBtn').addEventListener('click', async () => {
      const title = document.getElementById('title').value;
      const url = document.getElementById('url').value;

      if (!title || !url) {
        alert('Fill all fields');
        return;
      }

      try {
        await push(ref(db, 'gallery'), { title, url, createdAt: Date.now() });
        alert('Published to Gallery successfully!');
        document.getElementById('title').value = '';
        document.getElementById('url').value = '';
      } catch (e) {
        alert('Error: ' + e.message);
      }
    });
  </script>
</body>
</html>
